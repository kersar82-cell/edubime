<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDUBEMI — Courses</title>
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-header__brand">
      <img src="../assets/logo.png" alt="EDUBEMI" class="app-header__logo" />
      <span class="app-header__title">কোর্সসমূহ</span>
    </div>
    <div class="app-header__actions">
      <button class="app-header__icon-btn" data-nav="notifications">
        <img src="../assets/icons/bell.svg" alt="Notifications" class="app-header__icon" />
        <span class="badge" data-bind="notificationCount">3</span>
      </button>
    </div>
  </header>

  <div class="app-container">
    <main class="page-content">

      <section class="section">
        <div class="section__header">
          <h3 class="section__title">সকল কোর্স</h3>
        </div>
        <div data-bind="courseList">

          <div class="branch-card" data-bind="course[0]" data-nav="course-detail" style="margin-bottom: var(--space-md);">
            <div class="branch-card__top">
              <div class="branch-card__icon-wrap">
                <img src="../assets/icons/book.svg" alt="" class="branch-card__icon" />
              </div>
              <div class="branch-card__info">
                <p class="branch-card__name" data-bind="courseName">গণিত — ক্লাস ৮</p>
                <p class="branch-card__address" data-bind="courseInstructor">শিক্ষক: করিম স্যার</p>
              </div>
            </div>
          </div>

          <div class="branch-card" data-bind="course[1]" data-nav="course-detail" style="margin-bottom: var(--space-md);">
            <div class="branch-card__top">
              <div class="branch-card__icon-wrap">
                <img src="../assets/icons/book.svg" alt="" class="branch-card__icon" />
              </div>
              <div class="branch-card__info">
                <p class="branch-card__name" data-bind="courseName">বিজ্ঞান — ক্লাস ৮</p>
                <p class="branch-card__address" data-bind="courseInstructor">শিক্ষক: ফাতেমা ম্যাডাম</p>
              </div>
            </div>
          </div>

          <div class="branch-card" data-bind="course[2]" data-nav="course-detail">
            <div class="branch-card__top">
              <div class="branch-card__icon-wrap">
                <img src="../assets/icons/book.svg" alt="" class="branch-card__icon" />
              </div>
              <div class="branch-card__info">
                <p class="branch-card__name" data-bind="courseName">ইংরেজি — ক্লাস ৮</p>
                <p class="branch-card__address" data-bind="courseInstructor">শিক্ষক: রহিম স্যার</p>
              </div>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>

  <nav class="bottom-nav">
    <a class="bottom-nav__item" data-nav="home">
      <img src="../assets/icons/home.svg" alt="Home" class="bottom-nav__icon" />
      <span class="bottom-nav__label">হোম</span>
    </a>
    <a class="bottom-nav__item is-active" data-nav="courses">
      <img src="../assets/icons/book.svg" alt="Courses" class="bottom-nav__icon" />
      <span class="bottom-nav__label">কোর্স</span>
    </a>
    <a class="bottom-nav__item" data-nav="student-portal">
      <img src="../assets/icons/user.svg" alt="Portal" class="bottom-nav__icon" />
      <span class="bottom-nav__label">পোর্টাল</span>
    </a>
    <a class="bottom-nav__item" data-nav="messages">
      <img src="../assets/icons/chat.svg" alt="Messages" class="bottom-nav__icon" />
      <span class="bottom-nav__label">বার্তা</span>
    </a>
    <a class="bottom-nav__item" data-nav="profile">
      <img src="../assets/icons/settings.svg" alt="Profile" class="bottom-nav__icon" />
      <span class="bottom-nav__label">প্রোফাইল</span>
    </a>
  </nav>

  <script src="../js/app.js"></script>
  <script src="../js/notifications.js"></script>
</body>
                </html>
